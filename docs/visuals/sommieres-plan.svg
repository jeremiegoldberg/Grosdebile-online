<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
<title id="title">Plan urbain de Sommières pour Luanti</title>
<desc id="desc">Plan schématique du centre ancien : Vidourle nord-sud, pont romain est-ouest et ses 21 arches, sept visibles au-dessus du fleuve, faubourg à l'ouest, vieille ville à l'est, arcades du marché, places et château sur l'éperon.</desc>
