<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
<title id="title">Plan du port elfique NLite</title>
<desc id="desc">Plan top-down du port : bassin à l'ouest avec trois navires, canal transversal bordé de maisons mitoyennes, ponts arqués, cathédrale et remparts en fond, plage en escalier et place de débarquement à l'est.</desc>
<defs>
  <pattern id="water" width="26" height="18" patternUnits="userSpaceOnUse"><rect width="26" height="18" fill="#3e91b0"/><path d="M0 7 Q6 2 13 7 T26 7" fill="none" stroke="#9bd3df" stroke-width="2" opacity=".7"/></pattern>
  <pattern id="stone" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#b9b5aa"/><path d="M0 8H16M8 0V8M3 8V16" stroke="#89877f" stroke-width="1"/></pattern>
  <pattern id="roof" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#344a63"/><path d="M0 0L16 16M-8 8L8 24M8 -8L24 8" stroke="#62758b" stroke-width="2"/></pattern>
</defs>
<rect width="1200" height="860" fill="#e6e0d2"/>
<rect x="34" y="26" width="1132" height="94" rx="18" fill="#243846"/>
<text x="68" y="68" font-family="sans-serif" font-size="32" font-weight="800" fill="#fff">PORT ELFIQUE — PLAN DE RECONSTRUCTION</text>
<text x="70" y="99" font-family="sans-serif" font-size="17" fill="#d8e5e5">Lecture du plan local · bassin ouest · canal habité · cathédrale et remparts en fond</text>
<g transform="translate(80 150)">
  <rect width="1040" height="650" rx="18" fill="#d3cbb9" stroke="#857d6c" stroke-width="5"/>
  <!-- arrière rempart -->
  <rect x="54" y="52" width="930" height="22" fill="url(#stone)" stroke="#655f55" stroke-width="3"/>
  <g fill="#777c82" stroke="#4f5961" stroke-width="3">
    <rect x="92" y="25" width="34" height="62"/><rect x="246" y="25" width="34" height="62"/>
    <rect x="416" y="25" width="34" height="62"/><rect x="586" y="25" width="34" height="62"/>
    <rect x="756" y="25" width="34" height="62"/><rect x="916" y="25" width="34" height="62"/>
  </g>
  <!-- cathédrale en arrière-est -->
  <rect x="610" y="105" width="250" height="165" fill="#b9b3a8" stroke="#6a6258" stroke-width="5"/>
  <path d="M600 112L735 34L870 112Z" fill="url(#roof)" stroke="#34465a" stroke-width="5"/>
  <path d="M690 102L735 8L780 102Z" fill="#596c84" stroke="#35475a" stroke-width="4"/>
  <g fill="#526b82" stroke="#e0d8ca" stroke-width="4">
    <rect x="625" y="75" width="31" height="120"/><rect x="814" y="75" width="31" height="120"/>
  </g>
  <g fill="#9dc5cb" stroke="#6c8990" stroke-width="2">
    <rect x="644" y="145" width="13" height="38"/><rect x="710" y="145" width="13" height="38"/>
    <rect x="762" y="145" width="13" height="38"/><rect x="828" y="145" width="13" height="38"/>
  </g>
  <!-- port basin -->
  <rect x="40" y="225" width="255" height="270" rx="18" fill="url(#water)" stroke="#315f74" stroke-width="9"/>
  <path d="M45 250H292M45 470H292" stroke="#b1d6d2" stroke-width="5" opacity=".65"/>
  <!-- ships -->
  <g stroke="#503e2e" stroke-width="5" fill="#805632">
    <path d="M80 310Q125 352 170 310L158 372H93Z"/><path d="M128 309V250" stroke="#60452d" stroke-width="7"/>
    <path d="M128 255L95 297H128Z" fill="#d9d4bf"/><path d="M132 257L161 294H132Z" fill="#b9c3c3"/>
    <path d="M180 408Q218 448 255 408L245 462H190Z"/><path d="M218 407V360" stroke="#60452d" stroke-width="7"/>
    <path d="M218 362L194 398H218Z" fill="#bfaca0"/>
  </g>
  <!-- docks and cranes -->
  <g stroke="#66452e" stroke-width="8" fill="none">
    <path d="M62 250V210H112M62 210L91 234M255 456V510H286"/>
  </g>
  <g fill="#a57c50" stroke="#684a30" stroke-width="3">
    <rect x="55" y="475" width="28" height="25"/><rect x="93" y="470" width="28" height="30"/>
    <rect x="258" y="230" width="26" height="24"/>
  </g>
  <!-- main canal -->
  <rect x="282" y="348" width="700" height="112" fill="url(#water)" stroke="#315f74" stroke-width="8"/>
  <path d="M298 375H966M298 432H966" stroke="#a5d9dd" stroke-width="4" opacity=".7"/>
  <!-- connecting harbour throat -->
  <rect x="255" y="349" width="60" height="110" fill="url(#water)" stroke="#315f74" stroke-width="4"/>
  <!-- wharves -->
  <rect x="300" y="314" width="666" height="31" fill="url(#stone)" stroke="#777167" stroke-width="3"/>
  <rect x="300" y="463" width="666" height="31" fill="url(#stone)" stroke="#777167" stroke-width="3"/>
  <!-- houses both banks -->
  <g stroke="#665244" stroke-width="3">
    <g fill="#d9c7aa">
      <rect x="316" y="176" width="76" height="132"/><rect x="402" y="176" width="76" height="132"/>
      <rect x="488" y="176" width="76" height="132"/><rect x="574" y="176" width="76" height="132"/>
      <rect x="660" y="176" width="76" height="132"/><rect x="746" y="176" width="76" height="132"/>
      <rect x="832" y="176" width="76" height="132"/>
      <rect x="316" y="500" width="76" height="132"/><rect x="402" y="500" width="76" height="132"/>
      <rect x="488" y="500" width="76" height="132"/><rect x="574" y="500" width="76" height="132"/>
      <rect x="660" y="500" width="76" height="132"/><rect x="746" y="500" width="76" height="132"/>
      <rect x="832" y="500" width="76" height="132"/>
    </g>
    <g fill="#7f4c43" stroke="#4f3834" stroke-width="3">
      <path d="M309 180L354 145L399 180Z M395 180L440 145L485 180Z M481 180L526 145L571 180Z M567 180L612 145L657 180Z M653 180L698 145L743 180Z M739 180L784 145L829 180Z M825 180L870 145L915 180Z"/>
      <path d="M309 505L354 470L399 505Z M395 505L440 470L485 505Z M481 505L526 470L571 505Z M567 505L612 470L657 505Z M653 505L698 470L743 505Z M739 505L784 470L829 505Z M825 505L870 470L915 505Z"/>
    </g>
  </g>
  <!-- bridges with rounded arcs -->
  <g stroke="#777267" stroke-width="12" fill="none">
    <path d="M440 348V336Q466 298 492 336V348"/>
    <path d="M650 348V336Q676 298 702 336V348"/>
    <path d="M850 348V336Q876 298 902 336V348"/>
  </g>
  <g stroke="#777267" stroke-width="12" fill="none">
    <path d="M440 460V472Q466 510 492 472V460"/>
    <path d="M650 460V472Q676 510 702 472V460"/>
    <path d="M850 460V472Q876 510 902 472V460"/>
  </g>
  <!-- east landing and stepped beach -->
  <rect x="916" y="270" width="86" height="360" fill="#d9c69e" stroke="#9c8964" stroke-width="4"/>
  <g fill="#c5b18c" stroke="#9b8968" stroke-width="2">
    <rect x="926" y="290" width="76" height="30"/><rect x="926" y="326" width="76" height="30"/>
    <rect x="926" y="362" width="76" height="30"/><rect x="926" y="398" width="76" height="30"/>
    <rect x="926" y="434" width="76" height="30"/><rect x="926" y="470" width="76" height="30"/>
  </g>
  <text x="165" y="527" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#e8f4f4">BASSIN DU PORT · 3 NAVIRES</text>
  <text x="635" y="406" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#edf8f8">CANAL PRINCIPAL</text>
  <text x="625" y="160" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#4c4035">CATHÉDRALE / SILHOUETTE ARRIÈRE</text>
  <text x="958" y="654" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#5d513d">PLAGE EN ESCALIER</text>
  <text x="630" y="690" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4d514f">MAISONS MITOYENNES · DEUX RIVES · QUAI CONTINU</text>
  <text x="520" y="830" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#4e5c5a">Plan schématique de la reconstruction visible ; zones masquées non déductibles des captures d'écran.</text>
</g>
</svg>