<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Le Royaume du Nawak, un monde persistant partagé</title>
<desc id="desc">Illustration isométrique schématique d'un royaume commun avec château, villages de guildes, parcelles personnelles et terres sauvages.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#a9d7ef"/><stop offset="1" stop-color="#eaf4d8"/></linearGradient>
 <linearGradient id="grass" x2="0" y2="1"><stop stop-color="#8cc879"/><stop offset="1" stop-color="#4c9b68"/></linearGradient>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#9ca9b7"/><stop offset="1" stop-color="#586b80"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1440" height="820" fill="url(#sky)"/>
<circle cx="1190" cy="120" r="52" fill="#fff2b5"/>
<path d="M0 360 Q180 260 340 350 T700 330 T1080 350 T1440 300 V820 H0Z" fill="#a8cba1"/>
<path d="M0 455 Q220 370 440 455 T900 430 T1440 420 V820 H0Z" fill="url(#grass)"/>
<!-- distant mountains -->
<path d="M0 390 L150 220 260 385 390 190 530 390 680 235 830 390 1000 210 1160 390 1310 230 1440 390Z" fill="#91a9b3" opacity=".62"/>
<path d="M120 254l30-34 28 36 12-13 24 38H95z M360 225l30-35 30 42 18-14 30 48H330z M970 250l30-40 34 43 18-18 28 45H940z" fill="#f7fbf7"/>
<!-- wildlands -->
<path d="M0 480 Q130 420 260 490 L260 820H0Z" fill="#6cae6c"/>
<path d="M1180 460 Q1310 400 1440 470V820H1180Z" fill="#70b36d"/>
<g fill="#326d4a"><path d="M70 520l35-95 35 95h-22v35H92v-35z"/><path d="M175 575l30-80 30 80h-18v30h-24v-30z"/><path d="M1270 545l35-95 35 95h-22v35h-26v-35z"/><path d="M1360 610l30-80 30 80h-18v30h-24v-30z"/></g>
<!-- river -->
<path d="M0 650 Q220 570 420 650 T850 650 T1200 625 T1440 650" fill="none" stroke="#55b9d5" stroke-width="38" opacity=".9"/>
<path d="M0 650 Q220 570 420 650 T850 650 T1200 625 T1440 650" fill="none" stroke="#bcecf1" stroke-width="5" opacity=".9"/>
<!-- castle island shadow -->
<ellipse cx="710" cy="430" rx="270" ry="65" fill="#294d43" opacity=".22" filter="url(#shadow)"/>
<!-- castle -->
<g stroke="#45576a" stroke-width="5" stroke-linejoin="round">
 <path d="M520 420L710 320 900 420 900 500 710 600 520 500Z" fill="url(#stone)"/>
 <path d="M520 420L710 320 900 420 710 520Z" fill="#c1ccd1"/>
 <path d="M570 380V300h55v110 M795 380V300h55v110" fill="#8293a4"/>
 <path d="M560 300l38-52 38 52z M785 300l38-52 38 52z" fill="#9a5960"/>
 <path d="M665 365V245h90v165" fill="#a7b5bf"/>
 <path d="M650 245l60-75 60 75z" fill="#7c4656"/>
 <path d="M690 455q20-55 40 0v45h-40z" fill="#304b61"/>
 <path d="M600 430h30v45h-30z M790 430h30v45h-30z" fill="#dce9eb"/>
</g>
<g fill="#f1d17a"><path d="M595 325h12v24h-12z M820 325h12v24h-12z M705 215h12v24h-12z"/></g>
<text x="710" y="635" font-family="sans-serif" font-size="27" text-anchor="middle" font-weight="700" fill="#233b42">CHÂTEAU DES BRUMES</text>
<!-- guild villages -->
<g font-family="sans-serif" font-weight="700" text-anchor="middle">
 <g transform="translate(190 410)"><path d="M-105 20L0-38 105 20V95H-105Z" fill="#d9c7a3" stroke="#705b48" stroke-width="5"/><path d="M-120 20L0-55 120 20" fill="none" stroke="#a74f4d" stroke-width="22"/><rect x="-18" y="48" width="36" height="47" fill="#75513d"/><text y="132" font-size="22" fill="#314c40">VILLAGE DES GUILDES</text><text y="158" font-size="15" fill="#314c40">Bâtiments et places communs</text></g>
 <g transform="translate(1190 410)"><path d="M-95 25L0-30 95 25V90H-95Z" fill="#e0d2ad" stroke="#705b48" stroke-width="5"/><path d="M-108 25L0-48 108 25" fill="none" stroke="#6685a4" stroke-width="20"/><rect x="-16" y="45" width="32" height="45" fill="#75513d"/><text y="128" font-size="22" fill="#314c40">TERRES SAUVAGES</text><text y="154" font-size="15" fill="#314c40">Exploration et constructions libres</text></g>
</g>
<!-- personal plots -->
<g stroke="#f8e9bb" stroke-width="4" fill="#b7d78d">
 <path d="M390 520l70-38 70 38-70 40z"/><path d="M390 520v42l70 40v-42z"/><path d="M530 520l70-38 70 38-70 40z"/><path d="M530 520v42l70 40v-42z"/>
 <path d="M820 520l70-38 70 38-70 40z"/><path d="M820 520v42l70 40v-42z"/><path d="M960 520l70-38 70 38-70 40z"/><path d="M960 520v42l70 40v-42z"/>
</g>
<g fill="#fff" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle"><text x="460" y="620">PARCELLES PERSONNELLES</text><text x="890" y="620">MAISONS DE JOUEURS</text></g>
<!-- paths -->
<g fill="none" stroke="#e7d3a5" stroke-width="15" stroke-linecap="round"><path d="M710 570Q600 650 460 600"/><path d="M710 570Q810 660 890 600"/><path d="M900 500Q1050 520 1130 470"/></g>
<rect x="70" y="38" width="620" height="104" rx="24" fill="#183b3a" opacity=".9"/>
<text x="105" y="82" font-family="sans-serif" font-size="38" font-weight="800" fill="#fff">LE ROYAUME DU NAWAK</text>
<text x="108" y="117" font-family="sans-serif" font-size="21" fill="#d8efcf">Un seul monde persistant, des milliers d'histoires</text>
<rect x="70" y="700" width="1300" height="78" rx="18" fill="#183b3a" opacity=".92"/>
<g font-family="sans-serif" font-size="20" fill="#fff" text-anchor="middle"><text x="250" y="747">MONDE COMMUN</text><text x="555" y="747">PARCELLES PRIVÉES</text><text x="870" y="747">VILLAGES DE GUILDE</text><text x="1190" y="747">TERRES LIBRES</text></g>
</svg>